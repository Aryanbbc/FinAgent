# Explicit V0.6 research-validation example. Normal experiments remain single-asset by default.
source_experiment_config: config/experiments.yaml

validation:
  enabled: true
  assets:
    - asset: EXAMPLE
      dataset: data/raw/example_ohlcv.csv
    - asset: EXAMPLE_SECONDARY
      dataset: data/raw/example_ohlcv_secondary.csv
  asset_pass:
    maximum_drawdown: 0.20
    minimum_trades: 1
    minimum_sharpe: 0.0
  walk_forward:
    window_mode: rolling
    train_size: 15
    test_size: 10
    step_size: 10
    minimum_train_length: 15
    minimum_test_length: 10
    non_overlapping_test_windows: true
    min_windows: 2
  leakage_checks:
    enabled: true
  sensitivity:
    enabled: true
    parameters:
      momentum_window: [3, 4, 5, 6, 7]
      mean_reversion_threshold: [-0.8, -1.0, -1.2]
  bootstrap:
    enabled: true
    samples: 200
    confidence_level: 0.95
    random_seed: 42
  robustness:
    maximum_drawdown: 0.20
  ablation:
    enabled: true
  benchmarks:
    enabled: true
