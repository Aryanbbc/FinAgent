application:
  name: FinAgent
  version: "0.8"
  live_trading_enabled: false

market:
  annualization_factor: 252

backtest:
  transaction_costs:
    percentage_fee: 0.001
    fixed_fee: 0.0
  position_fraction: 1.0

regime:
  enabled: true
  return_window: 10
  volatility_window: 10
  moving_average_window: 10
  moving_average_slope_window: 5
  momentum_window: 5
  drawdown_window: 20
  thresholds:
    bull_return_threshold: 0.02
    bear_return_threshold: -0.02
    moving_average_slope_threshold: 0.003
    high_volatility_threshold: 0.30
    low_volatility_threshold: 0.10
    stress_drawdown_threshold: -0.12

agents:
  # Disabled by default so existing V0.1/V0.2 configurations preserve direct strategy execution.
  enabled: false
  technical:
    trend_threshold: 0.003
    momentum_threshold: 0.005
    high_volatility_threshold: 0.30
    low_volatility_threshold: 0.10
    oversold_rsi: 30.0
    overbought_rsi: 70.0
  strategy:
    available_strategies:
      moving_average:
        fast_window: 5
        slow_window: 20
      momentum:
        lookback_window: 5
        entry_threshold: 0.0
        exit_threshold: -0.02
      mean_reversion:
        lookback_window: 10
        entry_zscore: -1.0
        exit_zscore: 0.0
    regime_strategy_map:
      bull: momentum
      bear: moving_average
      sideways: mean_reversion
      high_volatility: moving_average
      low_volatility: mean_reversion
      stress: moving_average
    # V0.5 may vary these bounded position weights only through config/improvement.yaml.
    strategy_weights: {}
  risk:
    max_position_size: 1.0
    max_drawdown: 0.20
    max_volatility: 0.50
    reduced_volatility_threshold: 0.30
    reduced_position_size: 0.50
    minimum_confidence: 0.15

critic:
  # Disabled by default so V0.1–V0.3 configurations retain their prior behavior.
  enabled: false
  thresholds:
    strong_sharpe_threshold: 1.0
    weak_sharpe_threshold: 0.0
    controlled_drawdown_threshold: 0.10
    high_drawdown_threshold: 0.15
    low_turnover_threshold: 0.50
    excessive_turnover_threshold: 2.00
    high_transaction_cost_ratio: 0.01
    minimum_closed_trades: 3

learning:
  # Disabled by default. V0.5 runs only when a user invokes scripts/run_improvement.py.
  enabled: false

validation:
  # Disabled by default; V0.6 is invoked explicitly with scripts/run_validation.py.
  enabled: false

data:
  # V0.8 defaults: strict validation and local immutable cache revisions.
  cache_path: data/cache
  missing_data_policy: reject
