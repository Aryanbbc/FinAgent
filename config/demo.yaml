# Safe, reproducible FinAgent 1.0.0 demo configuration. It uses only bundled CSV data.
application:
  demo_mode: true
  version: "1.0.0"

experiment:
  asset: DEMO_EXAMPLE
  dataset: data/raw/example_ohlcv.csv
  starting_capital: 100000.0
  random_seed: 42

database_path: data/demo/finagent_v1_demo.db

agents:
  enabled: true

critic:
  enabled: true

strategy:
  name: momentum
  parameters:
    lookback_window: 5
    entry_threshold: 0.0
    exit_threshold: -0.02

backtest:
  annualization_factor: 252
  position_fraction: 1.0
  transaction_costs:
    percentage_fee: 0.001
    fixed_fee: 1.0
