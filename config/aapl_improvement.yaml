# User-invoked V0.5 controlled improvement example. It never enables live or paper trading.
source_experiment_config: config/aapl_experiment.yaml
# Must match config/aapl_experiment.yaml; never use the shared demo/example DB.
database_path: data/aapl_research.db

learning:
  enabled: true
  # Omit to retrieve the newest memory for this exact AAPL baseline only.
  memory_experiment_id: null
  search:
    mode: neighborhood
    max_candidates: 5
    # Each predeclared profile contains only allowlisted settings consumed by
    # the deterministic strategy, risk, or execution layer.  Combinations are
    # explicit because holding/cooldown controls and exposure sizing are most
    # meaningful together; this is not an unbounded parameter search.
    profiles:
      - changes:
          execution_controls:
            minimum_holding_period_bars: 60
            reentry_cooldown_bars: 20
          strategy_weights:
            moving_average: 0.10
            momentum: 0.10
            mean_reversion: 0.10
      - changes:
          execution_controls:
            minimum_holding_period_bars: 30
            reentry_cooldown_bars: 10
          strategy_weights:
            moving_average: 0.05
            momentum: 0.05
            mean_reversion: 0.05
      - changes:
          execution_controls:
            minimum_holding_period_bars: 20
            reentry_cooldown_bars: 10
          regime_strategy_mappings:
            bull: moving_average
            bear: moving_average
            sideways: moving_average
            high_volatility: moving_average
            low_volatility: moving_average
            stress: moving_average
      - changes:
          execution_controls:
            minimum_holding_period_bars: 20
            reentry_cooldown_bars: 10
          momentum_entry_threshold: 0.02
          momentum_exit_threshold: -0.04
      - changes:
          execution_controls:
            minimum_holding_period_bars: 20
            reentry_cooldown_bars: 10
          risk_confidence_threshold: 0.50
  walk_forward:
    train_size: 504
    test_size: 126
    # At least test_size: no held-out observation is reused in this example.
    step_size: 126
    min_windows: 5
  promotion_gate:
    minimum_sharpe_improvement: 0.05
    maximum_drawdown: 0.20
    minimum_window_pass_rate: 0.60
    minimum_trades: 1
    maximum_turnover: 5.0
