# User-invoked V0.5 controlled improvement example. It never enables live or paper trading.
source_experiment_config: config/aapl_experiment.yaml
# Must match config/aapl_experiment.yaml; never use the shared demo/example DB.
database_path: data/aapl_research.db

learning:
  enabled: true
  # Omit to retrieve the newest memory for this exact AAPL baseline only.
  memory_experiment_id: null
  search:
    mode: neighborhood
    max_candidates: 5
    # This is a coarse, predeclared exposure frontier around the demonstrated
    # low-churn behavior.  It intentionally does not tune a fine-grained value
    # to the observed OOS promotion boundary.  Every setting is consumed by
    # the deterministic strategy or execution layer.
    profiles:
      - changes:
          execution_controls:
            minimum_holding_period_bars: 30
            reentry_cooldown_bars: 5
          strategy_weights:
            moving_average: 0.05
            momentum: 0.05
            mean_reversion: 0.05
      - changes:
          execution_controls:
            minimum_holding_period_bars: 60
            reentry_cooldown_bars: 20
          strategy_weights:
            moving_average: 0.15
            momentum: 0.15
            mean_reversion: 0.15
      - changes:
          execution_controls:
            minimum_holding_period_bars: 120
            reentry_cooldown_bars: 40
          strategy_weights:
            moving_average: 0.25
            momentum: 0.25
            mean_reversion: 0.25
      - changes:
          execution_controls:
            minimum_holding_period_bars: 120
            reentry_cooldown_bars: 40
          strategy_weights:
            moving_average: 0.35
            momentum: 0.35
            mean_reversion: 0.35
      - changes:
          execution_controls:
            minimum_holding_period_bars: 120
            reentry_cooldown_bars: 40
          strategy_weights:
            moving_average: 0.50
            momentum: 0.50
            mean_reversion: 0.50
  walk_forward:
    train_size: 504
    test_size: 126
    # At least test_size: no held-out observation is reused in this example.
    step_size: 126
    min_windows: 5
  promotion_gate:
    minimum_sharpe_improvement: 0.05
    maximum_drawdown: 0.20
    minimum_window_pass_rate: 0.60
    minimum_trades: 1
    maximum_turnover: 5.0
