[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.7.0"
description = "A reproducible quantitative trading research and simulation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "plotly>=5.20"]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["finagent*"]
