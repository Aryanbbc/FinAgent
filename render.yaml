services:
  - type: web
    name: finagent-api
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn finagent.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FINAGENT_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finagent-postgres
          property: connectionString
      - key: DATA_CACHE_PATH
        value: /tmp/finagent-cache
      - key: REPORTS_PATH
        value: /tmp/finagent-reports
      - key: LIVE_TRADING_ENABLED
        value: "false"
databases:
  - name: finagent-postgres
    region: oregon
    plan: 0.1c-256mb
    databaseName: finagent
    user: finagent
    diskSizeGB: 1
