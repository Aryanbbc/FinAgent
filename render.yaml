services:
  - type: web
    name: finagent-api
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn finagent.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FINAGENT_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finagent-postgres
          property: connectionString
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: FINAGENT_ADMIN_API_KEY
        sync: false
      - key: FINAGENT_MUTATION_RATE_LIMIT
        value: "5"
      - key: FINAGENT_MUTATION_RATE_WINDOW_SECONDS
        value: "300"
      - key: LIVE_MARKET_ENABLED
        value: "false"
      - key: LIVE_DEFAULT_SYMBOL
        value: AAPL
      - key: LIVE_INTERVAL
        value: 1min
      - key: LIVE_BUFFER_SIZE
        value: "300"
      - key: LIVE_POLL_SECONDS
        value: "60"
      - key: DATA_CACHE_PATH
        value: /tmp/finagent-cache
      - key: REPORTS_PATH
        value: /tmp/finagent-reports
      - key: LIVE_TRADING_ENABLED
        value: "false"
databases:
  - name: finagent-postgres
    region: oregon
    plan: 0.1c-256mb
    databaseName: finagent
    user: finagent
    diskSizeGB: 1
